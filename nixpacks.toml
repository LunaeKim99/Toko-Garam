[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_sqlite", "nodejs_20", "composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = [
  "mkdir -p /data",
  "touch /data/database.sqlite",
  "php artisan key:generate --force",
  "php artisan optimize:clear",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && (php artisan storage:link || true) && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"